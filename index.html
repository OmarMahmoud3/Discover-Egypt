<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12304A" />
    <meta name="description" content="اكتشف مصر — بوابتك لاستكشاف أعظم حضارة وتاريخ، المعالم السياحية، الأهرامات، والمعابد التراثية." />
    
    <!-- Preconnect to Font and Image Origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://thumb.wikimedia.org" crossorigin />

    <!-- Preload Critical LCP Hero Image -->
    <link
      rel="preload"
      as="image"
      href="https://thumb.wikimedia.org/wikipedia/commons/thumb/4/42/The_Grand_Egyptian_Museum.jpg/1280px-The_Grand_Egyptian_Museum.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail"
      fetchpriority="high"
    />

    <!-- Non-blocking Google Fonts: Cairo & Inter -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Material Symbols (targeted axes reduce payload from 4.0MB to 438KB; display=block prevents text flash) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
      />
    </noscript>

    <title>اكتشف مصر | Discover Egypt</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
